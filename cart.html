<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart &amp; checkout — Ladydee Minimart Store</title>
<meta name="description" content="Review your basket, choose a delivery zone and see your delivery discount before you check out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛒</text></svg>">
<link rel="stylesheet" href="styles.css?v=10">
<script ></script>
</head>
<body data-page="cart">

<div id="site-header"></div>

<section class="page-head">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span data-i="chevronRight"></span><span>Cart &amp; checkout</span>
    </nav>
    <h1>Your basket</h1>
    <p class="sub">Delivery fees and any delivery discount are shown before you pay.</p>
  </div>
</section>

<main class="section">
  <div class="wrap">
    <div class="stepper" id="stepper"></div>
    <div id="cartView"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="components.js?v=10"></script>
<script src="api-client.js?v=10"></script>
<script src="app.js?v=10"></script>
<script src="brevi.js?v=10"></script>
<script>
(function () {
  var S = window.Ladydee;
  S.mount('products');
  document.querySelectorAll('[data-i]').forEach(function (e) { e.innerHTML = S.icon(e.getAttribute('data-i')); });

  var TAX = 0.075;
  var step = 1;                       /* 1 cart · 2 delivery · 3 payment · 4 done */
  var zoneId = 'island';
  var coupon = null;                  /* applied coupon object */
  var deliveryCode = null;            /* applied delivery promo code */
  var payMethod = 'Card';
  var placed = null;

  var user = S.currentUser();
  var form = {
    name: user ? user.name : '',
    email: user ? user.email : '',
    phone: user ? (user.phone || '') : '',
    address: '',
    city: 'Lagos',
    notes: ''
  };
  if (user && user.addresses && user.addresses.length) {
    var def = user.addresses.filter(function (a) { return a.isDefault; })[0] || user.addresses[0];
    form.address = def.address; form.city = def.city; form.phone = def.phone || form.phone;
    zoneId = def.zone || zoneId;
  }

  function totals() {
    var sub = S.cartSubtotal();
    var disc = 0;
    if (coupon) disc = Math.round(sub * (coupon.value / 100));
    var q = S.deliveryQuote(zoneId, sub, { member: S.isLoggedIn(), deliveryCode: deliveryCode });
    var tax = Math.round((sub - disc) * TAX);
    return { sub: sub, disc: disc, q: q, tax: tax, total: sub - disc + q.fee + tax };
  }

  function renderStepper() {
    var labels = ['Cart', 'Delivery', 'Payment'];
    var html = '';
    labels.forEach(function (l, i) {
      var n = i + 1;
      var cls = step === n ? 'active' : step > n ? 'done' : '';
      html += '<span class="step ' + cls + '"><span class="num">' + (step > n ? S.icon('check') : n) + '</span><span>' + l + '</span></span>';
      if (i < labels.length - 1) html += '<span class="step-line' + (step > n ? ' done' : '') + '"></span>';
    });
    document.getElementById('stepper').innerHTML = html;
  }

  function summaryHTML(t, opts) {
    opts = opts || {};
    var lines = S.cartLines();
    var html = '<div class="panel summary"><div class="panel-head"><b>Order summary</b>' +
      '<span class="muted" style="font-size:.84rem">' + S.cartCount() + ' item' + (S.cartCount() === 1 ? '' : 's') + '</span></div><div class="panel-body">';

    if (opts.compact) {
      html += lines.map(function (l) {
        return '<div class="cart-line"><span class="cart-line-media"><img src="' + l.product.image + '" alt=""></span>' +
          '<span><b>' + S.esc(l.product.name) + '</b><small>' + S.esc(l.product.size) + ' × ' + l.qty + '</small></span>' +
          '<span class="amt">' + S.money(l.line) + '</span></div>';
      }).join('');
      html += '<div style="height:14px"></div>';
    }

    html += '<div class="sum-row"><span>Subtotal</span><b>' + S.money(t.sub) + '</b></div>';
    if (t.disc) html += '<div class="sum-row"><span>Discount (' + S.esc(coupon.code) + ')</span><b style="color:var(--green)">−' + S.money(t.disc) + '</b></div>';
    html += '<div class="sum-row"><span>Delivery — ' + S.esc(S.zone(zoneId).name) + '</span><b>' +
      (t.q.fee === 0 ? '<span style="color:var(--green)">Free</span>' : S.money(t.q.fee)) + '</b></div>';
    if (t.q.discount > 0) html += '<div class="sum-row"><span style="color:var(--green)">Delivery discount</span><b style="color:var(--green)">−' + S.money(t.q.discount) + '</b></div>';
    html += '<div class="sum-row"><span>VAT (7.5%)</span><b>' + S.money(t.tax) + '</b></div>';
    html += '<div class="sum-row total"><span>Total</span><b>' + S.money(t.total) + '</b></div>';

    if (t.q.reasons.length) {
      html += '<div class="deliv-note" style="margin-top:14px">' + S.icon('sparkles') + '<span>' + t.q.reasons.join(' · ') + '</span></div>';
    } else if (t.sub > 0 && t.sub < S.getDeliveryRules().freeOver) {
      var gap = S.getDeliveryRules().freeOver - t.sub;
      html += '<div class="deliv-note warn" style="margin-top:14px">' + S.icon('truck') +
        '<span>Add ' + S.money(gap) + ' more to unlock free delivery.</span></div>';
    }

    if (!opts.hidePromo) {
      html += '<div style="margin-top:16px">';
      if (coupon) {
        html += '<div class="promo-note">' + S.icon('checkCircle') + 'Coupon ' + S.esc(coupon.code) + ' applied — ' + coupon.value + '% off</div>';
      } else {
        html += '<div class="promo"><input type="text" id="promoInput" placeholder="Promo code" aria-label="Promo code"><button class="btn btn-outline btn-sm" id="promoBtn" type="button">Apply</button></div>';
      }
      if (deliveryCode) {
        html += '<div class="promo-note">' + S.icon('truck') + 'Delivery code ' + S.esc(deliveryCode) + ' applied</div>';
      } else {
        html += '<div class="promo"><input type="text" id="delivInput" placeholder="Delivery code" aria-label="Delivery promo code"><button class="btn btn-outline btn-sm" id="delivBtn" type="button">Apply</button></div>';
      }
      html += '<div class="hint muted" style="font-size:.76rem;margin-top:6px">Try WELCOME10 for 10% off, or FREEDEL for free delivery.</div>';
      html += '</div>';
    }

    if (opts.cta) html += '<div style="margin-top:18px">' + opts.cta + '</div>';
    html += '<div class="secure-note">' + S.icon('lock') + 'Demo checkout — no real payment is taken</div>';
    html += '</div></div>';
    return html;
  }

  function renderCart() {
    var lines = S.cartLines();
    if (!lines.length) {
      document.getElementById('stepper').innerHTML = '';
      document.getElementById('cartView').innerHTML =
        '<div class="empty"><div style="width:84px;height:84px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 20px">' +
        '<span style="width:38px;height:38px;display:block">' + S.icon('cart') + '</span></div>' +
        '<b>Your basket is empty</b><p>Add a few essentials and they will show up here.</p>' +
        '<a class="btn btn-primary btn-lg" href="/products">Start shopping</a></div>';
      return;
    }
    var t = totals();
    var items = lines.map(function (l) {
      return '<div class="citem">' +
        '<span class="citem-media"><img src="' + l.product.image + '" alt="' + S.esc(l.product.name) + '"></span>' +
        '<div class="citem-info"><b><a href="/product?id=' + l.product.id + '">' + S.esc(l.product.name) + '</a></b>' +
          '<small>' + S.esc(l.product.size) + ' · ' + S.esc(S.catName(l.product.category)) + '</small>' +
          '<div class="citem-controls">' +
            '<span class="qty"><button type="button" data-dec="' + l.product.id + '" aria-label="Decrease">' + S.icon('minus') + '</button>' +
            '<input type="number" value="' + l.qty + '" min="1" max="99" data-qty="' + l.product.id + '" aria-label="Quantity for ' + S.esc(l.product.name) + '">' +
            '<button type="button" data-inc="' + l.product.id + '" aria-label="Increase">' + S.icon('plus') + '</button></span>' +
            '<button class="remove-btn" type="button" data-remove="' + l.product.id + '">' + S.icon('trash') + 'Remove</button>' +
          '</div></div>' +
        '<div class="citem-right"><span class="price">' + S.money(l.line) + '</span>' +
          '<small class="muted">' + S.money(l.product.price) + ' each</small></div>' +
      '</div>';
    }).join('');

    document.getElementById('cartView').innerHTML =
      '<div class="cart-layout">' +
        '<div class="panel"><div class="panel-head"><b>Items in your basket</b>' +
          '<button class="btn btn-ghost btn-sm" id="clearCart" type="button">Clear basket</button></div>' +
          '<div class="panel-body">' + items + '</div></div>' +
        summaryHTML(t, { cta: '<button class="btn btn-primary btn-lg btn-block" id="toDelivery" type="button">Continue to delivery ' + S.icon('arrowRight') + '</button>' }) +
      '</div>';
  }

  function renderDelivery() {
    var t = totals();
    var zones = S.ZONES.map(function (z) {
      var q = S.deliveryQuote(z.id, t.sub, { member: S.isLoggedIn(), deliveryCode: deliveryCode });
      return '<label class="zone-opt' + (z.id === zoneId ? ' selected' : '') + '">' +
        '<input type="radio" name="zone" value="' + z.id + '"' + (z.id === zoneId ? ' checked' : '') + '>' +
        '<span><b>' + S.esc(z.name) + '</b><small>' + S.esc(z.eta) + '</small></span>' +
        '<span class="zo-fee">' + (q.fee === 0 ? '<b>Free</b>' : '<b>' + S.money(q.fee) + '</b>') +
          (q.discount > 0 ? '<s>' + S.money(q.base) + '</s>' : '') + '</span></label>';
    }).join('');

    document.getElementById('cartView').innerHTML =
      '<div class="cart-layout">' +
        '<div class="panel"><div class="panel-head"><b>Delivery details</b>' +
          '<button class="btn btn-ghost btn-sm" id="backToCart" type="button">' + S.icon('chevronLeft') + ' Back to basket</button></div>' +
          '<div class="panel-body">' +
            '<div class="form-grid">' +
              '<div class="field"><label for="fName">Full name</label><input id="fName" value="' + S.esc(form.name) + '" placeholder="Your name"></div>' +
              '<div class="field"><label for="fPhone">Phone number</label><input id="fPhone" value="' + S.esc(form.phone) + '" placeholder="0801 234 5678"></div>' +
              '<div class="field full"><label for="fEmail">Email (for the order confirmation)</label><input id="fEmail" type="email" value="' + S.esc(form.email) + '" placeholder="you@example.com"></div>' +
              '<div class="field full"><label for="fAddress">Delivery address</label><input id="fAddress" value="' + S.esc(form.address) + '" placeholder="Street, area"></div>' +
              '<div class="field"><label for="fCity">City</label><input id="fCity" value="' + S.esc(form.city) + '" placeholder="Lagos"></div>' +
              '<div class="field"><label for="fNotes">Delivery notes (optional)</label><input id="fNotes" value="' + S.esc(form.notes) + '" placeholder="Landmark, gate colour…"></div>' +
            '</div>' +
            '<h4 style="margin:24px 0 12px;font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Delivery zone</h4>' +
            '<div class="zone-list">' + zones + '</div>' +
          '</div></div>' +
        summaryHTML(t, { compact: true, cta: '<button class="btn btn-primary btn-lg btn-block" id="toPayment" type="button">Continue to payment ' + S.icon('arrowRight') + '</button>' }) +
      '</div>';
  }

  function renderPayment() {
    var t = totals();
    var methods = [
      ['Card', 'creditCard', 'Visa, Mastercard, Verve', 'Pay now'],
      ['Bank transfer', 'wallet', 'Transfer to the account shown after ordering', 'Pay now'],
      ['Pay on delivery', 'truck', 'Cash or transfer when the rider arrives', 'On arrival'],
      ['USSD', 'phone', 'Dial the code from any registered phone', 'Pay now']
    ];
    var opts = methods.map(function (m) {
      return '<label class="pay-option' + (payMethod === m[0] ? ' selected' : '') + '">' +
        '<input type="radio" name="pay" value="' + m[0] + '"' + (payMethod === m[0] ? ' checked' : '') + '>' +
        '<span class="po-ico">' + S.icon(m[1]) + '</span>' +
        '<span><b>' + m[0] + '</b><small>' + m[2] + '</small></span>' +
        '<span class="po-right">' + m[3] + '</span></label>';
    }).join('');

    document.getElementById('cartView').innerHTML =
      '<div class="cart-layout">' +
        '<div class="panel"><div class="panel-head"><b>Payment method</b>' +
          '<button class="btn btn-ghost btn-sm" id="backToDelivery" type="button">' + S.icon('chevronLeft') + ' Back to delivery</button></div>' +
          '<div class="panel-body">' +
            '<div class="pay-options">' + opts + '</div>' +
            '<div class="deliv-note" style="margin-top:20px">' + S.icon('info') +
              '<span>This is a demonstration store. No card is charged and no payment details are collected.</span></div>' +
            '<div style="margin-top:20px;padding:16px;background:var(--cream);border:1px solid var(--line);border-radius:var(--radius)">' +
              '<b style="font-size:.9rem">Delivering to</b>' +
              '<p class="muted" style="font-size:.88rem;margin-top:6px;line-height:1.6">' + S.esc(form.name || '—') + '<br>' +
                S.esc(form.address || '—') + ', ' + S.esc(form.city || '') + '<br>' + S.esc(form.phone || '') + '</p>' +
              '<p style="font-size:.86rem;margin-top:8px"><b style="color:var(--green)">' + S.esc(S.zone(zoneId).name) + '</b> · ' + S.esc(S.zone(zoneId).eta) + '</p>' +
            '</div>' +
          '</div></div>' +
        summaryHTML(t, { compact: true, hidePromo: true, cta: '<button class="btn btn-primary btn-lg btn-block" id="placeOrder" type="button">' + S.icon('lock') + ' Place order — ' + S.money(t.total) + '</button>' }) +
      '</div>';
  }

  function renderDone() {
    var o = placed;
    var steps = S.orderStatuses();
    var idx = steps.indexOf(o.status);
    var track = steps.map(function (s, i) {
      var cls = i < idx ? 'done' : i === idx ? 'current' : '';
      return '<div class="tstep ' + cls + '"><div class="tstep-rail"><span class="tstep-dot">' + (i < idx ? S.icon('check') : '') + '</span><span class="tstep-line"></span></div>' +
        '<div class="tstep-body"><b>' + S.statusLabel(s) + '</b><small>' +
        (i < idx ? 'Completed' : i === idx ? 'In progress' : 'Pending') + '</small></div></div>';
    }).join('');

    document.getElementById('stepper').innerHTML = '';
    document.getElementById('cartView').innerHTML =
      '<div class="panel"><div class="confirm">' +
        '<div class="confirm-badge">' + S.icon('checkCircle') + '</div>' +
        '<h2>Order confirmed</h2>' +
        '<p class="muted">Thank you' + (o.customer.name ? ', ' + S.esc(o.customer.name.split(' ')[0]) : '') + '. We have your order and our team is picking it now.</p>' +
        '<div class="order-code">' + S.esc(o.code) + '</div>' +
        '<div class="confirm-meta">' +
          '<div class="cm"><small>Estimated arrival</small><b>' + S.esc(o.eta) + '</b><span class="muted" style="font-size:.82rem">' + S.esc(S.zone(o.customer.zone).name) + '</span></div>' +
          '<div class="cm"><small>Payment</small><b>' + S.esc(o.payment) + '</b><span class="muted" style="font-size:.82rem">' + S.money(o.total) + ' total</span></div>' +
          '<div class="cm"><small>Confirmation email</small><b>' + (o.customer.email ? 'Sent' : 'No email given') + '</b><span class="muted" style="font-size:.82rem">' + S.esc(o.customer.email || '—') + '</span></div>' +
        '</div>' +
        '<div style="margin-top:30px;text-align:left;max-width:520px;margin-left:auto;margin-right:auto">' +
          '<h3 style="font-size:1rem;margin-bottom:16px">Delivery progress</h3>' +
          '<div class="track-steps">' + track + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px">' +
          '<a class="btn btn-primary" href="/account">View in my account</a>' +
          '<button class="btn btn-outline" id="viewEmail" type="button">' + S.icon('mail') + ' Preview confirmation email</button>' +
          '<a class="btn btn-ghost" href="/products">Continue shopping</a>' +
        '</div>' +
      '</div></div>';

    var ve = document.getElementById('viewEmail');
    if (ve) ve.addEventListener('click', function () {
      var log = window.LadydeeEmail.getLog();
      var entry = log.filter(function (e) { return e.template === 'order-confirmation'; })[0];
      if (entry) window.LadydeeEmail.showPreview(entry);
      else S.toast('No email preview available', 'mail');
    });
  }

  function render() {
    if (step === 4) { renderDone(); return; }
    renderStepper();
    if (step === 1) renderCart();
    else if (step === 2) renderDelivery();
    else renderPayment();
    S.observeReveals();
  }

  /* ---- events ---- */
  document.getElementById('cartView').addEventListener('click', function (e) {
    var t = e.target.closest('button, label');
    if (!t) return;
    var inc = e.target.closest('[data-inc]');
    if (inc) { var id = inc.getAttribute('data-inc'); S.setQty(id, S.getCart().filter(function (x) { return x.id === id; })[0].qty + 1); render(); return; }
    var dec = e.target.closest('[data-dec]');
    if (dec) { var id2 = dec.getAttribute('data-dec'); S.setQty(id2, S.getCart().filter(function (x) { return x.id === id2; })[0].qty - 1); render(); return; }
    var rm = e.target.closest('[data-remove]');
    if (rm) { S.removeFromCart(rm.getAttribute('data-remove')); S.toast('Item removed', 'trash'); render(); return; }
    if (e.target.closest('#clearCart')) { S.clearCart(); render(); return; }
    if (e.target.closest('#toDelivery')) { step = 2; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (e.target.closest('#backToCart')) { step = 1; render(); return; }
    if (e.target.closest('#toPayment')) {
      form.name = document.getElementById('fName').value.trim();
      form.phone = document.getElementById('fPhone').value.trim();
      form.email = document.getElementById('fEmail').value.trim();
      form.address = document.getElementById('fAddress').value.trim();
      form.city = document.getElementById('fCity').value.trim();
      form.notes = document.getElementById('fNotes').value.trim();
      if (!form.name || !form.phone || !form.address) { S.toast('Please fill in name, phone and address', 'alert'); return; }
      step = 3; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (e.target.closest('#backToDelivery')) { step = 2; render(); return; }
    if (e.target.closest('#placeOrder')) { placeOrder(); return; }
    if (e.target.closest('#promoBtn')) {
      var v = document.getElementById('promoInput').value.trim();
      var res = S.applyCoupon(v);
      if (!res.ok) { S.toast(res.reason, 'alert'); return; }
      coupon = res.coupon; S.toast('Coupon ' + coupon.code + ' applied', 'tag'); render(); return;
    }
    if (e.target.closest('#delivBtn')) {
      var dv = document.getElementById('delivInput').value.trim().toUpperCase();
      var rules = S.getDeliveryRules();
      if (!rules.codes[dv]) { S.toast('That delivery code is not valid', 'alert'); return; }
      deliveryCode = dv; S.toast('Delivery code ' + dv + ' applied', 'truck'); render(); return;
    }
  });

  document.getElementById('cartView').addEventListener('change', function (e) {
    if (e.target.name === 'zone') { zoneId = e.target.value; render(); return; }
    if (e.target.name === 'pay') { payMethod = e.target.value; render(); return; }
    if (e.target.hasAttribute('data-qty')) { S.setQty(e.target.getAttribute('data-qty'), e.target.value); render(); return; }
  });

  function placeOrder() {
    var t = totals();
    var code = 'LDM-' + new Date().getFullYear() + '-' + Math.floor(10000 + Math.random() * 89999);
    var order = {
      code: code, date: new Date().toISOString(), status: 'placed',
      items: S.cartLines().map(function (l) {
        return { id: l.product.id, name: l.product.name, size: l.product.size, image: l.product.image, price: l.product.price, qty: l.qty };
      }),
      subtotal: t.sub, discount: t.disc, coupon: coupon ? coupon.code : null,
      deliveryBase: t.q.base, deliveryDiscount: t.q.discount, deliveryFee: t.q.fee,
      deliveryCode: deliveryCode, tax: t.tax, total: t.total,
      customer: { name: form.name, email: form.email, phone: form.phone, address: form.address, city: form.city, zone: zoneId, notes: form.notes },
      payment: payMethod, eta: S.zone(zoneId).eta, source: 'checkout'
    };
    S.addOrder(order);
    if (coupon) S.redeemCoupon(coupon.code);
    S.clearCart();
    S.refreshBadges();
    placed = order;
    step = 4;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });

    /* Brevi: order confirmation email */
    if (form.email) {
      window.LadydeeEmail.sendOrderConfirmation(order).then(function (res) {
        if (res.demo) S.toast('Order email prepared (demo mode)', 'mail');
        else if (res.ok) S.toast('Confirmation email sent', 'mail');
        else S.toast('Email could not be sent', 'alert');
      });
    }
  }

  render();
})();
</script>
</body>
</html>
