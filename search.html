<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Sokoni</title>
<meta name="description" content="Search the Sokoni catalogue and filter results by category, price and rating.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>&#128717;&#65039;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="search">

<div id="site-header"></div>

<main>

  <section class="page-head">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span data-i="chevronRight"></span><span id="crumb">Search</span>
      </nav>
      <h1 id="pageTitle">Search the catalogue</h1>
      <p class="sub" id="pageSub">Type what you are looking for — results update as you filter.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="listing">

        <!-- FILTERS -->
        <aside class="filters" id="filters" aria-label="Search filters">
          <div class="filters-head">
            <b>Refine</b>
            <button class="btn btn-ghost btn-sm" id="resetFilters" type="button">Reset</button>
          </div>

          <div class="filter-group">
            <h4>Keyword</h4>
            <div class="promo" style="margin:0">
              <input type="search" id="kwInput" placeholder="e.g. headphones" aria-label="Search keyword">
              <button class="btn btn-dark btn-sm" id="kwApply" type="button">Go</button>
            </div>
          </div>

          <div class="filter-group">
            <h4>Category</h4>
            <div id="catFilters"></div>
          </div>

          <div class="filter-group">
            <h4>Price</h4>
            <div class="price-inputs">
              <input type="number" id="minPrice" placeholder="Min" min="0" step="1" aria-label="Minimum price">
              <span style="color:var(--muted-2)">–</span>
              <input type="number" id="maxPrice" placeholder="Max" min="0" step="1" aria-label="Maximum price">
            </div>
            <input type="range" class="range" id="priceRange" min="0" max="1200" step="10" value="1200" aria-label="Maximum price slider">
            <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px">
              <span>$0</span><span id="rangeLabel">$1200</span>
            </div>
          </div>

          <div class="filter-group">
            <h4>Customer rating</h4>
            <div id="ratingFilters"></div>
          </div>

          <div class="filter-group">
            <h4>Offers</h4>
            <label class="check"><input type="checkbox" id="onSale"> <span>On sale only</span></label>
            <label class="check"><input type="checkbox" id="inStock"> <span>In stock</span></label>
          </div>

          <div class="filter-group">
            <button class="btn btn-dark btn-block" id="applyFilters" type="button">Show results</button>
          </div>
        </aside>

        <!-- RESULTS -->
        <div>
          <div class="toolbar">
            <span class="count" id="resultCount">Loading…</span>
            <div style="display:flex;align-items:center;gap:10px">
              <button class="btn btn-outline btn-sm filters-toggle" id="openFilters" type="button"><span data-i="sliders"></span> Filters</button>
              <div class="select-wrap">
                <label for="sort" class="sr-only">Sort by</label>
                <select id="sort">
                  <option value="relevance">Sort: Relevance</option>
                  <option value="price-asc">Price: low to high</option>
                  <option value="price-desc">Price: high to low</option>
                  <option value="rating">Customer rating</option>
                  <option value="discount">Biggest discount</option>
                  <option value="name">Name: A to Z</option>
                </select>
                <span data-i="chevronDown"></span>
              </div>
            </div>
          </div>

          <div class="chips" id="chips"></div>
          <div class="grid-products" id="grid" aria-live="polite"></div>
        </div>

      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="app.js"></script>
<script>
(function () {
  var S = window.Sokoni;

  document.querySelectorAll('[data-i]').forEach(function (e) { e.innerHTML = S.icon(e.getAttribute('data-i')); });

  var state = { cats: [], q: '', min: null, max: null, rating: 0, sale: false, inStock: false, sort: 'relevance' };

  /* category checkboxes */
  document.getElementById('catFilters').innerHTML = S.CATEGORIES.map(function (c) {
    var n = S.PRODUCTS.filter(function (p) { return p.category === c.id; }).length;
    return '<label class="check"><input type="checkbox" value="' + c.id + '" data-cat>' +
      '<span>' + c.name + '</span><span class="count">' + n + '</span></label>';
  }).join('');

  /* rating options */
  var ratings = [4.5, 4, 3.5, 3];
  function starsOnly(r) {
    var full = Math.round(r), t = '';
    for (var i = 1; i <= 5; i++) t += '<span style="opacity:' + (i <= full ? 1 : .28) + '">' + S.icon('star') + '</span>';
    return '<span class="s-icons" style="color:var(--amber)">' + t + '</span>';
  }
  document.getElementById('ratingFilters').innerHTML = ratings.map(function (r) {
    return '<label class="check"><input type="radio" name="rating" value="' + r + '" data-rating>' +
      '<span style="display:inline-flex;align-items:center;gap:7px">' + starsOnly(r) +
      '<span>' + r + ' &amp; up</span></span></label>';
  }).join('') + '<label class="check"><input type="radio" name="rating" value="0" data-rating checked><span>Any rating</span></label>';

  /* read URL params */
  var urlCat = S.param('cat'), urlQ = S.param('q'), urlSort = S.param('sort');
  if (urlCat) state.cats = urlCat.split(',').filter(Boolean);
  if (urlQ) state.q = urlQ;
  if (urlSort) state.sort = urlSort;

  function syncInputs() {
    document.querySelectorAll('[data-cat]').forEach(function (i) { i.checked = state.cats.indexOf(i.value) > -1; });
    var sr = document.querySelector('[data-rating][value="' + state.rating + '"]');
    if (sr) sr.checked = true;
    document.getElementById('minPrice').value = state.min == null ? '' : state.min;
    document.getElementById('maxPrice').value = state.max == null ? '' : state.max;
    document.getElementById('kwInput').value = state.q;
    document.getElementById('sort').value = state.sort;
    document.getElementById('onSale').checked = state.sale;
    document.getElementById('inStock').checked = state.inStock;
  }

  function results() {
    var out = state.q ? S.searchMatches(state.q) : S.PRODUCTS.slice();
    if (state.cats.length) out = out.filter(function (p) { return state.cats.indexOf(p.category) > -1; });
    if (state.min != null) out = out.filter(function (p) { return p.price >= state.min; });
    if (state.max != null) out = out.filter(function (p) { return p.price <= state.max; });
    if (state.rating) out = out.filter(function (p) { return p.rating >= state.rating; });
    if (state.sale) out = out.filter(function (p) { return !!p.oldPrice; });
    if (state.inStock) out = out.filter(function (p) { return p.stock > 0; });

    switch (state.sort) {
      case 'price-asc':  out.sort(function (a, b) { return a.price - b.price; }); break;
      case 'price-desc': out.sort(function (a, b) { return b.price - a.price; }); break;
      case 'rating':     out.sort(function (a, b) { return b.rating - a.rating; }); break;
      case 'discount':   out.sort(function (a, b) { return S.discountOf(b) - S.discountOf(a); }); break;
      case 'name':       out.sort(function (a, b) { return a.name.localeCompare(b.name); }); break;
    }
    return out;
  }

  function chips() {
    var out = [];
    if (state.q) out.push(['q', '\u201c' + state.q + '\u201d']);
    state.cats.forEach(function (c) { out.push(['cat:' + c, S.catName(c)]); });
    if (state.min != null || state.max != null) {
      out.push(['price', 'Price ' + (state.min != null ? S.money(state.min) : '$0') + ' \u2013 ' + (state.max != null ? S.money(state.max) : 'any')]);
    }
    if (state.rating) out.push(['rating', state.rating + '\u2605 & up']);
    if (state.sale) out.push(['sale', 'On sale']);
    if (state.inStock) out.push(['stock', 'In stock']);
    document.getElementById('chips').innerHTML = out.map(function (c) {
      return '<span class="chip">' + S.esc(c[1]) + '<button data-chip="' + c[0] + '" aria-label="Remove filter">' + S.icon('close') + '</button></span>';
    }).join('');
  }

  function render() {
    var list = results();
    S.renderProducts('#grid', list);
    document.getElementById('resultCount').innerHTML = '<b>' + list.length + '</b> result' + (list.length === 1 ? '' : 's') +
      (state.q ? ' for \u201c' + S.esc(state.q) + '\u201d' : '');
    chips();
    S.stagger('.pcard', .04);

    var title = state.q ? 'Search: \u201c' + state.q + '\u201d' : (state.cats.length === 1 ? S.catName(state.cats[0]) : 'Search the catalogue');
    document.getElementById('crumb').textContent = 'Search';
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSub').textContent = state.q
      ? 'Showing what matches your search — narrow it further with the filters on the left.'
      : 'Type what you are looking for, or browse everything and filter it down.';
  }

  function syncFromInputs() {
    state.cats = Array.prototype.slice.call(document.querySelectorAll('[data-cat]:checked')).map(function (i) { return i.value; });
    var r = document.querySelector('[data-rating]:checked');
    state.rating = r ? parseFloat(r.value) : 0;
    var mn = document.getElementById('minPrice').value;
    var mx = document.getElementById('maxPrice').value;
    state.min = mn === '' ? null : Math.max(0, parseFloat(mn));
    state.max = mx === '' ? null : Math.max(0, parseFloat(mx));
    state.sale = document.getElementById('onSale').checked;
    state.inStock = document.getElementById('inStock').checked;
  }

  function runSearch() {
    state.q = document.getElementById('kwInput').value.trim();
    history.replaceState(null, '', 'search.html' + (state.q ? '?q=' + encodeURIComponent(state.q) : ''));
    render();
  }

  document.getElementById('filters').addEventListener('change', function (e) {
    if (e.target.id === 'priceRange') return;
    syncFromInputs(); render();
  });

  document.getElementById('kwApply').addEventListener('click', runSearch);
  document.getElementById('kwInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
  });
  document.getElementById('kwInput').addEventListener('input', function () {
    state.q = this.value.trim(); render();
  });

  document.getElementById('priceRange').addEventListener('input', function () {
    var v = parseInt(this.value, 10);
    document.getElementById('rangeLabel').textContent = '$' + v;
    document.getElementById('maxPrice').value = v >= 1200 ? '' : v;
    syncFromInputs(); render();
  });
  document.getElementById('minPrice').addEventListener('input', function () { syncFromInputs(); render(); });
  document.getElementById('maxPrice').addEventListener('input', function () {
    var v = this.value === '' ? 1200 : parseInt(this.value, 10);
    document.getElementById('priceRange').value = Math.min(1200, v);
    document.getElementById('rangeLabel').textContent = '$' + Math.min(1200, v);
    syncFromInputs(); render();
  });

  document.getElementById('sort').addEventListener('change', function () { state.sort = this.value; render(); });

  document.getElementById('resetFilters').addEventListener('click', function () {
    state = { cats: [], q: '', min: null, max: null, rating: 0, sale: false, inStock: false, sort: state.sort };
    document.getElementById('kwInput').value = '';
    document.getElementById('minPrice').value = ''; document.getElementById('maxPrice').value = '';
    document.getElementById('priceRange').value = 1200; document.getElementById('rangeLabel').textContent = '$1200';
    document.querySelectorAll('[data-cat]').forEach(function (i) { i.checked = false; });
    var any = document.querySelector('[data-rating][value="0"]'); if (any) any.checked = true;
    document.getElementById('onSale').checked = false; document.getElementById('inStock').checked = false;
    history.replaceState(null, '', 'search.html');
    render();
    S.toast('Filters cleared');
  });

  document.getElementById('applyFilters').addEventListener('click', function () {
    var f = document.getElementById('filters');
    if (f.classList.contains('open')) f.classList.remove('open');
    var sc = document.querySelector('.scrim'); if (sc) sc.classList.remove('show');
  });
  document.getElementById('openFilters').addEventListener('click', function () {
    document.getElementById('filters').classList.add('open');
    var sc = document.querySelector('.scrim'); if (sc) sc.classList.add('show');
  });

  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-chip]');
    if (!b) return;
    var key = b.getAttribute('data-chip');
    if (key.indexOf('cat:') === 0) {
      var c = key.slice(4);
      state.cats = state.cats.filter(function (x) { return x !== c; });
      document.querySelectorAll('[data-cat]').forEach(function (i) { if (i.value === c) i.checked = false; });
    } else if (key === 'q') {
      state.q = ''; document.getElementById('kwInput').value = ''; history.replaceState(null, '', 'search.html');
    } else if (key === 'price') {
      state.min = null; state.max = null;
      document.getElementById('minPrice').value = ''; document.getElementById('maxPrice').value = '';
      document.getElementById('priceRange').value = 1200; document.getElementById('rangeLabel').textContent = '$1200';
    } else if (key === 'rating') {
      state.rating = 0; var any = document.querySelector('[data-rating][value="0"]'); if (any) any.checked = true;
    } else if (key === 'sale') {
      state.sale = false; document.getElementById('onSale').checked = false;
    } else if (key === 'stock') {
      state.inStock = false; document.getElementById('inStock').checked = false;
    }
    render();
  });

  syncInputs();
  render();
  S.observeReveals();
})();
</script>
</body>
</html>
