<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Ladydee Minimart Store</title>
<meta name="description" content="Create a Ladydee Minimart Store account to track orders, save addresses and get free delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛒</text></svg>">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body data-page="signup">

<div id="site-header"></div>

<div class="auth-wrap">
  <aside class="auth-aside">
    <h2>Join Ladydee</h2>
    <p>One account for faster checkout, saved addresses, order tracking and free delivery on every order.</p>
    <div class="auth-points">
      <div class="auth-point"><span data-i="truck"></span><span><b>Free delivery for members</b><small>On every order, any zone</small></span></div>
      <div class="auth-point"><span data-i="clipboard"></span><span><b>Track every order</b><small>From placed to delivered</small></span></div>
      <div class="auth-point"><span data-i="heart"></span><span><b>Save your favourites</b><small>Wishlist synced to your account</small></span></div>
      <div class="auth-point"><span data-i="mapPin"></span><span><b>Saved addresses</b><small>Check out in two taps</small></span></div>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-steps" id="authSteps"><span class="as-dot on"></span><span class="as-dot"></span><span class="as-dot"></span></div>
      <div id="authBody"></div>
    </div>
  </main>
</div>

<div id="site-footer"></div>

<script src="app.js?v=9"></script>
<script src="brevi.js?v=9"></script>
<script>
(function () {
  var S = window.Ladydee;
  S.mount('products');
  document.querySelectorAll('[data-i]').forEach(function (e) { e.innerHTML = S.icon(e.getAttribute('data-i')); });

  var step = 1;
  var draft = { name: '', email: '', phone: '', password: '' };
  var code = '';

  function setSteps(n) {
    document.querySelectorAll('.as-dot').forEach(function (d, i) { d.classList.toggle('on', i < n); });
  }

  function strength(pw) {
    var s = 0;
    if (pw.length >= 8) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  }

  function renderDetails() {
    setSteps(1);
    document.getElementById('authBody').innerHTML =
      '<h1>Create your account</h1><p>It takes less than a minute.</p>' +
      '<div class="demo-note">' + S.icon('info') + '<span><b>Demo store.</b> Your details are stored only in this browser (localStorage). Nothing is sent to a server.</span></div>' +
      '<form class="auth-form" id="signupForm" novalidate>' +
        '<div class="field"><label for="sName">Full name</label><input id="sName" value="' + S.esc(draft.name) + '" placeholder="Alex Morgan" autocomplete="name"></div>' +
        '<div class="field"><label for="sEmail">Email address</label><input id="sEmail" type="email" value="' + S.esc(draft.email) + '" placeholder="you@example.com" autocomplete="email"></div>' +
        '<div class="field"><label for="sPhone">Phone number</label><input id="sPhone" value="' + S.esc(draft.phone) + '" placeholder="0801 234 5678" autocomplete="tel"></div>' +
        '<div class="field"><label for="sPw">Password</label>' +
          '<div class="pw-wrap"><input id="sPw" type="password" placeholder="At least 8 characters" autocomplete="new-password">' +
          '<button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">' + S.icon('eye') + '</button></div>' +
          '<div class="pw-meter"><span class="pw-seg" id="seg1"></span><span class="pw-seg" id="seg2"></span><span class="pw-seg" id="seg3"></span></div>' +
          '<span class="pw-label" id="pwLabel">Use 8+ characters with a mix of letters, numbers and symbols.</span></div>' +
        '<label class="check"><input type="checkbox" id="sTerms"><span>I agree to the terms and the privacy policy.</span></label>' +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">Create account ' + S.icon('arrowRight') + '</button>' +
      '</form>' +
      '<p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>';

    var pw = document.getElementById('sPw');
    pw.addEventListener('input', function () {
      var s = strength(pw.value);
      ['seg1', 'seg2', 'seg3'].forEach(function (id, i) {
        var el = document.getElementById(id);
        el.className = 'pw-seg' + (i < s ? ' on-' + s : '');
      });
      document.getElementById('pwLabel').textContent = ['Too weak', 'Weak', 'Good', 'Strong'][s] + ' password';
    });
    document.getElementById('pwToggle').addEventListener('click', function () {
      var t = pw.type === 'password';
      pw.type = t ? 'text' : 'password';
      this.innerHTML = S.icon(t ? 'eyeOff' : 'eye');
    });

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      draft.name = document.getElementById('sName').value.trim();
      draft.email = document.getElementById('sEmail').value.trim();
      draft.phone = document.getElementById('sPhone').value.trim();
      draft.password = pw.value;
      if (!draft.name) { S.toast('Please enter your name', 'alert'); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(draft.email)) { S.toast('Please enter a valid email', 'alert'); return; }
      if (draft.password.length < 8) { S.toast('Password must be at least 8 characters', 'alert'); return; }
      if (!document.getElementById('sTerms').checked) { S.toast('Please accept the terms', 'alert'); return; }

      var res = S.signup(draft);
      if (!res.ok) { S.toast(res.reason, 'alert'); return; }

      code = String(Math.floor(100000 + Math.random() * 899999));
      window.LadydeeEmail.sendVerification(res.user, code).then(function (r) {
        if (r.demo) S.toast('Verification email prepared (demo mode)', 'mail');
        else if (r.ok) S.toast('Verification email sent', 'mail');
      });
      renderVerify();
    });
  }

  function renderVerify() {
    setSteps(2);
    document.getElementById('authBody').innerHTML =
      '<h1>Check your email</h1><p>We sent a 6-digit code to <b>' + S.esc(draft.email) + '</b>.</p>' +
      '<div class="demo-note">' + S.icon('mail') + '<span><b>Demo mode.</b> No email actually leaves the browser. Your code is <b>' + code + '</b> — or open the preview to see the email.</span></div>' +
      '<div class="otp-row" id="otpRow">' + [0,1,2,3,4,5].map(function (i) {
        return '<input type="text" inputmode="numeric" maxlength="1" data-otp="' + i + '" aria-label="Digit ' + (i+1) + '">';
      }).join('') + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:20px">' +
        '<button class="btn btn-primary btn-lg" id="verifyBtn" type="button" style="flex:1">Verify &amp; continue</button>' +
        '<button class="btn btn-outline btn-lg" id="previewBtn" type="button">' + S.icon('eye') + ' Preview email</button>' +
      '</div>' +
      '<p class="auth-alt">Didn\'t get it? <a href="#" id="resend">Resend the code</a></p>';

    var inputs = Array.prototype.slice.call(document.querySelectorAll('[data-otp]'));
    inputs.forEach(function (inp, i) {
      inp.addEventListener('input', function () {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
      });
    });
    inputs[0].focus();

    document.getElementById('previewBtn').addEventListener('click', function () {
      var log = window.LadydeeEmail.getLog();
      var entry = log.filter(function (e) { return e.template === 'signup-verification'; })[0];
      if (entry) window.LadydeeEmail.showPreview(entry);
    });

    document.getElementById('resend').addEventListener('click', function (e) {
      e.preventDefault();
      code = String(Math.floor(100000 + Math.random() * 899999));
      var u = S.getUsers().filter(function (x) { return x.email === draft.email.toLowerCase(); })[0];
      window.LadydeeEmail.sendVerification(u || { name: draft.name, email: draft.email }, code);
      S.toast('New code sent — ' + code, 'mail');
      renderVerify();
    });

    document.getElementById('verifyBtn').addEventListener('click', function () {
      var entered = inputs.map(function (i) { return i.value; }).join('');
      if (entered.length < 6) { S.toast('Enter all six digits', 'alert'); return; }
      if (entered !== code) { S.toast('That code is not correct', 'alert'); return; }
      S.verifyUser(draft.email);
      S.login(draft.email, draft.password);
      renderDone();
    });
  }

  function renderDone() {
    setSteps(3);
    document.getElementById('authBody').innerHTML =
      '<div style="text-align:center">' +
        '<div class="confirm-badge">' + S.icon('checkCircle') + '</div>' +
        '<h1>You are all set</h1>' +
        '<p class="muted" style="margin-bottom:24px">Your account is verified and you are signed in. Free delivery is now active on your orders.</p>' +
        '<div style="display:grid;gap:10px">' +
          '<a class="btn btn-primary btn-lg btn-block" href="/products">Start shopping</a>' +
          '<a class="btn btn-outline btn-lg btn-block" href="/account">Go to my account</a>' +
        '</div>' +
      '</div>';
  }

  renderDetails();
})();
</script>
</body>
</html>
