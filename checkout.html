<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure checkout — Adeola Stores</title>
<meta name="description" content="Confirm your delivery details and pay securely for your Adeola Stores order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛒</text></svg>">
<link rel="stylesheet" href="/styles.css?v=13">
<link rel="stylesheet" href="/checkout.css?v=1">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main class="checkout-wrap">
  <div class="checkout-heading">
    <span class="eyebrow">Secure checkout</span>
    <h1>Complete your order</h1>
    <p class="sub">Confirm where to deliver your groceries, accept the terms, then pay securely.</p>
  </div>
  <div id="modeBanner"></div>
  <div id="checkoutMessage" class="checkout-notice" hidden></div>
  <div id="checkoutContent">
    <div class="checkout-loading"><div class="checkout-spinner"></div><p>Checking your account and basket…</p></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/components.js?v=13"></script>
<script src="/api-client.js?v=13"></script>
<script src="/app.js?v=13"></script>
<script src="/checkout-flow.js?v=1"></script>
<script>
(function(){
  'use strict';
  var S=window.Ladydee;
  S.mount('checkout');
  var C=window.LadydeeCheckout;
  var message=document.getElementById('checkoutMessage');
  var content=document.getElementById('checkoutContent');
  var params=new URLSearchParams(location.search);
  var ref=params.get('reference')||'';
  var sandboxOutcome=params.get('outcome')||'';
  var isSandboxReturn=params.get('sandbox')==='1';
  var termsAccepted=false;

  function esc(v){return S.esc(String(v==null?'':v));}
  function money(v){return S.money(v);}
  function showMessage(text,type){
    message.hidden=false;message.className='checkout-notice'+(type?' '+type:'');message.textContent=text;
  }
  function hideMessage(){message.hidden=true;message.textContent='';}
  function loginUrl(){
    var path='/checkout'+(ref?'?reference='+encodeURIComponent(ref)+(isSandboxReturn?'&sandbox=1&outcome='+encodeURIComponent(sandboxOutcome):''):'');
    location.replace('/login?redirect='+encodeURIComponent(path));
  }

  function summaryHTML(){
    var lines=S.cartLines();
    if(!lines.length)return '<div class="checkout-panel checkout-summary"><h2>Your basket</h2><p>Your cart is empty.</p><a class="btn btn-primary" href="/products">Browse products</a></div>';
    var html='<div class="checkout-panel checkout-summary"><h2>Order summary</h2>';
    lines.forEach(function(l){
      html+='<div class="checkout-summary-line"><div><span class="checkout-item-name">'+esc(l.product.name)+'</span><span class="checkout-item-sub">Qty '+l.qty+' × '+money(l.product.price)+'</span></div><b>'+money(l.line)+'</b></div>';
    });
    html+='<div class="checkout-summary-line"><span>Subtotal</span><b>'+money(S.cartSubtotal())+'</b></div>';
    html+='<div class="checkout-summary-line"><span>Delivery</span><span>Calculated securely on the server</span></div>';
    html+='<div class="checkout-summary-line checkout-total"><span>Total</span><span>Confirmed before payment</span></div>';
    html+='<p class="checkout-secure"><span aria-hidden="true">🔒</span> Your card details are entered on the payment provider\'s page, never on this website.</p></div>';
    return html;
  }

  function formHTML(user){
    var u=user||{};
    return '<div class="checkout-panel"><h2>Delivery information</h2>'+
      '<form id="deliveryForm" class="checkout-fields" novalidate>'+
      '<div class="field"><label for="buyerName">Full name</label><input id="buyerName" name="name" autocomplete="name" required maxlength="160" value="'+esc(u.name||'')+'"></div>'+
      '<div class="field"><label for="buyerPhone">Phone number</label><input id="buyerPhone" name="phone" autocomplete="tel" required maxlength="40" value="'+esc(u.phone||'')+'"></div>'+
      '<div class="field full"><label for="buyerEmail">Email (receipt is sent here)</label><input id="buyerEmail" name="email" type="email" autocomplete="email" value="'+esc(u.email||'')+'" readonly></div>'+
      '<div class="field full"><label for="buyerAddress">Delivery address</label><textarea id="buyerAddress" name="address" autocomplete="street-address" rows="3" required maxlength="500" placeholder="House number, street, area"></textarea></div>'+
      '<div class="field full"><label for="buyerCity">City / area</label><input id="buyerCity" name="city" autocomplete="address-level2" required maxlength="100" value="'+esc(u.city||'Lagos')+'"></div>'+
      '<div class="field full"><label for="buyerNotes">Delivery notes <span style="font-weight:400">(optional)</span></label><textarea id="buyerNotes" name="notes" rows="2" maxlength="1000" placeholder="Landmark or instructions"></textarea></div>'+
      '<div class="full">'+C.termsHTML(false)+'</div>'+
      '<div class="full"><button class="btn btn-primary btn-lg checkout-button" id="payButton" type="submit">Continue to secure payment</button><p class="checkout-secure">You will be taken to the payment provider to complete payment.</p></div>'+
      '</form></div>';
  }

  function bindForm(){
    var form=document.getElementById('deliveryForm');if(!form)return;
    var terms=document.getElementById('termsAccept');
    if(terms)terms.addEventListener('change',function(){termsAccepted=terms.checked;});
    form.addEventListener('submit',function(e){
      e.preventDefault();hideMessage();
      if(!form.reportValidity())return;
      if(!termsAccepted){
        showMessage('Please accept the Terms & Conditions, Returns Policy and Privacy Policy to continue.','error');
        if(terms){terms.focus();}
        return;
      }
      var cart=S.getCart().map(function(i){return {id:i.id,qty:Number(i.qty)};});
      if(!cart.length){showMessage('Your basket is empty. Add a product before checking out.','error');return;}
      var btn=document.getElementById('payButton');btn.disabled=true;btn.textContent='Preparing secure payment…';
      C.startPayment({
        items:cart,
        name:document.getElementById('buyerName').value,
        phone:document.getElementById('buyerPhone').value,
        address:document.getElementById('buyerAddress').value,
        city:document.getElementById('buyerCity').value,
        notes:document.getElementById('buyerNotes').value,
        termsAccepted:true
      }).then(function(r){
        if(r.unauthenticated){loginUrl();return;}
        if(!r.ok){
          showMessage(r.error||'We could not start payment. Please try again.','error');
          btn.disabled=false;btn.textContent='Continue to secure payment';return;
        }
        location.assign(r.authorizationUrl);
      });
    });
  }

  function renderCheckout(user){
    var lines=S.cartLines();
    if(!lines.length){content.innerHTML='<div class="checkout-panel"><h2>Your basket is empty</h2><p>Add some products before checking out.</p><a class="btn btn-primary" href="/products">Start shopping</a></div>';return;}
    content.innerHTML='<div class="checkout-layout">'+formHTML(user)+summaryHTML()+'</div>';
    bindForm();
  }

  function renderPaymentResult(){
    content.innerHTML='<div class="checkout-panel checkout-loading"><div class="checkout-spinner"></div><h2>Verifying your payment</h2><p>Please keep this page open while we confirm the transaction.</p></div>';
    C.verifyPayment(ref,isSandboxReturn?sandboxOutcome:undefined).then(function(r){
      if(r.unauthenticated){loginUrl();return;}
      if(r.ok&&r.status==='paid'){
        S.clearCart();S.refreshBadges();
        content.innerHTML='<div class="checkout-done">'+
          '<div class="checkout-done-head"><div class="checkout-tick" aria-hidden="true">✓</div>'+
          '<h2>Payment verified</h2><p>Thank you — your order is paid and confirmed. A copy of this receipt is on your account.</p></div>'+
          C.receiptHTML(r.order,{footNote:'Keep this reference for any delivery question.'})+
          '<div class="checkout-done-actions">'+
            '<button class="btn btn-primary" id="printReceipt" type="button">🖨 Print receipt</button>'+
            '<a class="btn btn-outline" href="/account">View your account</a>'+
            '<a class="btn btn-ghost" href="/products">Continue shopping</a>'+
          '</div></div>';
        var pr=document.getElementById('printReceipt');if(pr)pr.addEventListener('click',C.printReceipt);
      }else{
        var title=r.status==='failed'?'Payment not completed':'Payment still pending';
        content.innerHTML='<div class="checkout-panel checkout-result">'+
          '<div class="checkout-result-ico '+(r.status==='failed'?'bad':'wait')+'" aria-hidden="true">'+(r.status==='failed'?'×':'⏳')+'</div>'+
          '<h2>'+title+'</h2><p>'+esc(r.error||'We have not confirmed payment yet. Your order will not be marked as paid until verification succeeds.')+'</p>'+
          (r.order?'<p class="mono"><b>Order reference:</b> '+esc(r.reference)+'</p>':'<p class="mono"><b>Order reference:</b> '+esc(ref)+'</p>')+
          '<div class="checkout-done-actions"><button class="btn btn-primary" id="retryVerify" type="button">Check payment again</button>'+
          '<a class="btn btn-outline" href="/account">My account</a><a class="btn btn-ghost" href="/products">Continue shopping</a></div></div>';
        var rv=document.getElementById('retryVerify');if(rv)rv.addEventListener('click',renderPaymentResult);
      }
    });
  }

  function boot(){
    document.getElementById('modeBanner').innerHTML=C.modeBannerHTML();
    if(!S.authToken()){loginUrl();return;}
    C.load().then(function(){
      document.getElementById('modeBanner').innerHTML=C.modeBannerHTML();
      return C.request('/api/auth/me','GET');
    }).then(function(r){
      if(r.status===401||!r.data||!r.data.success){loginUrl();return;}
      if(ref)renderPaymentResult();else renderCheckout(r.data.user);
    }).catch(function(){
      showMessage('We could not confirm your sign-in. Please refresh or sign in again.','error');
      content.innerHTML='<div class="checkout-panel"><a class="btn btn-primary" href="/login?redirect=%2Fcheckout">Sign in again</a></div>';
    });
  }
  boot();
})();
</script>
</body>
</html>
