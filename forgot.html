<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Ladydee Minimart Store</title>
<meta name="description" content="Reset the password on your Ladydee Minimart Store account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛒</text></svg>">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body data-page="forgot">

<div id="site-header"></div>

<div class="auth-wrap">
  <aside class="auth-aside">
    <h2>Forgot your password?</h2>
    <p>It happens. We will send a short code to your email so you can set a new one.</p>
    <div class="auth-points">
      <div class="auth-point"><span data-i="key"></span><span><b>Six-digit code</b><small>Expires in 15 minutes</small></span></div>
      <div class="auth-point"><span data-i="lock"></span><span><b>Set a new password</b><small>Your old one stops working</small></span></div>
      <div class="auth-point"><span data-i="shield"></span><span><b>Nothing is shared</b><small>Demo store — all local to your browser</small></span></div>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-steps" id="authSteps"><span class="as-dot on"></span><span class="as-dot"></span><span class="as-dot"></span></div>
      <div id="authBody"></div>
    </div>
  </main>
</div>

<div id="site-footer"></div>

<script src="components.js?v=10"></script>
<script src="api-client.js?v=10"></script>
<script src="app.js?v=10"></script>
<script src="brevi.js?v=10"></script>
<script>
(function () {
  var S = window.Ladydee;
  S.mount('products');
  document.querySelectorAll('[data-i]').forEach(function (e) { e.innerHTML = S.icon(e.getAttribute('data-i')); });

  var step = 1, email = '', code = '';

  function setSteps(n) { document.querySelectorAll('.as-dot').forEach(function (d, i) { d.classList.toggle('on', i < n); }); }

  function renderEmail() {
    setSteps(1);
    document.getElementById('authBody').innerHTML =
      '<h1>Reset your password</h1><p>Enter the email on your account and we will send a reset code.</p>' +
      '<form class="auth-form" id="fpForm" novalidate>' +
        '<div class="field"><label for="fpEmail">Email address</label><input id="fpEmail" type="email" value="' + S.esc(email) + '" placeholder="you@example.com" autocomplete="email"></div>' +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">Send reset code</button>' +
      '</form>' +
      '<p class="auth-alt">Remembered it? <a href="/login">Back to sign in</a></p>';

    document.getElementById('fpForm').addEventListener('submit', function (e) {
      e.preventDefault();
      email = document.getElementById('fpEmail').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.toast('Please enter a valid email', 'alert'); return; }
      var u = S.getUsers().filter(function (x) { return x.email === email.toLowerCase(); })[0];
      code = String(Math.floor(100000 + Math.random() * 899999));
      window.LadydeeEmail.sendPasswordReset(u || { name: 'there', email: email }, code).then(function (r) {
        if (r.demo) S.toast('Reset email prepared (demo mode)', 'mail');
        else if (r.ok) S.toast('Reset email sent', 'mail');
      });
      renderCode();
    });
  }

  function renderCode() {
    setSteps(2);
    document.getElementById('authBody').innerHTML =
      '<h1>Enter the reset code</h1><p>We sent a 6-digit code to <b>' + S.esc(email) + '</b>.</p>' +
      '<div class="demo-note">' + S.icon('mail') + '<span><b>Demo mode.</b> Nothing was actually sent. Your code is <b>' + code + '</b>.</span></div>' +
      '<div class="otp-row" id="otpRow">' + [0,1,2,3,4,5].map(function (i) {
        return '<input type="text" inputmode="numeric" maxlength="1" data-otp="' + i + '" aria-label="Digit ' + (i+1) + '">';
      }).join('') + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:20px">' +
        '<button class="btn btn-primary btn-lg" id="codeBtn" type="button" style="flex:1">Continue</button>' +
        '<button class="btn btn-outline btn-lg" id="previewBtn" type="button">' + S.icon('eye') + ' Preview</button>' +
      '</div>';

    var inputs = Array.prototype.slice.call(document.querySelectorAll('[data-otp]'));
    inputs.forEach(function (inp, i) {
      inp.addEventListener('input', function () {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus(); });
    });
    inputs[0].focus();

    document.getElementById('previewBtn').addEventListener('click', function () {
      var log = window.LadydeeEmail.getLog();
      var entry = log.filter(function (e) { return e.template === 'password-reset'; })[0];
      if (entry) window.LadydeeEmail.showPreview(entry);
    });

    document.getElementById('codeBtn').addEventListener('click', function () {
      var entered = inputs.map(function (i) { return i.value; }).join('');
      if (entered !== code) { S.toast('That code is not correct', 'alert'); return; }
      renderNew();
    });
  }

  function renderNew() {
    setSteps(3);
    document.getElementById('authBody').innerHTML =
      '<h1>Set a new password</h1><p>Choose something you have not used before.</p>' +
      '<form class="auth-form" id="npForm" novalidate>' +
        '<div class="field"><label for="npPw">New password</label>' +
          '<div class="pw-wrap"><input id="npPw" type="password" placeholder="At least 8 characters" autocomplete="new-password">' +
          '<button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">' + S.icon('eye') + '</button></div></div>' +
        '<div class="field"><label for="npPw2">Confirm new password</label><input id="npPw2" type="password" placeholder="Repeat it" autocomplete="new-password"></div>' +
        '<button class="btn btn-primary btn-lg btn-block" type="submit">Update password</button>' +
      '</form>';

    var pw = document.getElementById('npPw');
    document.getElementById('pwToggle').addEventListener('click', function () {
      var t = pw.type === 'password';
      pw.type = t ? 'text' : 'password';
      this.innerHTML = S.icon(t ? 'eyeOff' : 'eye');
    });

    document.getElementById('npForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = pw.value, b = document.getElementById('npPw2').value;
      if (a.length < 8) { S.toast('Password must be at least 8 characters', 'alert'); return; }
      if (a !== b) { S.toast('The two passwords do not match', 'alert'); return; }
      var ok = S.resetPassword(email, a);
      if (!ok) { S.toast('No account found with that email', 'alert'); return; }
      document.getElementById('authBody').innerHTML =
        '<div style="text-align:center">' +
          '<div class="confirm-badge">' + S.icon('checkCircle') + '</div>' +
          '<h1>Password updated</h1>' +
          '<p class="muted" style="margin-bottom:24px">You can now sign in with your new password.</p>' +
          '<a class="btn btn-primary btn-lg btn-block" href="/login">Go to sign in</a>' +
        '</div>';
    });
  }

  renderEmail();
})();
</script>
</body>
</html>
